# Generated from src/admin/schema.yml by the build. Do not edit.
backend:
  name: github
  repo: responsibleIT/rit-website-eleventy
  branch: main
publish_mode: editorial_workflow
site_url: https://responsible-it.nl
display_url: https://responsible-it.nl
locale: nl
media_folder: content/uploads
public_folder: /uploads
slug:
  encoding: ascii
  clean_accents: true
collections:
  - name: projecten
    label: Projecten
    label_singular: Project
    folder: content/projecten
    path: '{{slug}}/index'
    media_folder: ''
    public_folder: ''
    create: true
    slug: '{{title}}'
    summary: '{{title}} ({{type}}, {{school_year}})'
    sortable_fields:
      - title
      - school_year
    fields:
      - name: title
        label: Titel
        widget: string
      - name: type
        label: Soort project
        widget: select
        options:
          - label: Studentenproject
            value: student
          - label: Onderzoeksproject
            value: research
      - name: summary
        label: Korte samenvatting
        widget: text
        hint: Voor de projectkaart en zoekmachines. Eén à twee zinnen.
      - name: school_year
        label: Studiejaar of jaar
        widget: string
        pattern:
          - ^\d{4}(-\d{4})?$
          - Bijvoorbeeld 2025-2026 of 2024
      - name: duration
        label: Duur
        widget: string
        required: false
        hint: Bijvoorbeeld 'Semester' of '1 jaar'.
      - name: featured
        label: Uitgelicht op de homepage
        widget: boolean
        default: false
        required: false
      - name: draft
        label: Concept (niet publiceren)
        widget: boolean
        default: false
        required: false
      - name: sketch
        label: p5-sketch uit de bibliotheek
        hint: Wordt bij het bouwen als afbeelding gerenderd. Laat leeg voor de standaardbanner.
        widget: relation
        collection: sketches
        value_field: '{{slug}}'
        search_fields:
          - title
        display_fields:
          - title
        required: false
      - name: sketch_file
        label: Eigen p5-sketch (.js)
        widget: file
        required: false
        hint: Gaat voor de bibliotheeksketch.
      - name: sketch_alt
        label: Beschrijving van de sketch (alt-tekst)
        widget: string
        required: false
      - name: card_image
        label: Eigen afbeelding voor de projectkaart
        widget: image
        required: false
        hint: Zonder afbeelding gebruikt de kaart de sketch.
      - name: body
        label: Uitgebreide beschrijving
        widget: markdown
        required: false
      - name: gallery
        label: Projectfoto's
        widget: list
        required: false
        fields:
          - name: image
            label: Foto
            widget: image
          - name: alt
            label: Beschrijving (alt-tekst)
            widget: string
      - name: video
        label: Video (YouTube/Vimeo-link)
        widget: string
        required: false
      - name: sources
        label: Bronnen en links
        widget: list
        required: false
        fields:
          - name: label
            label: Naam
            widget: string
          - name: url
            label: Link
            widget: string
      - name: partners
        label: Partners
        widget: relation
        collection: partners
        value_field: '{{slug}}'
        search_fields:
          - name
        display_fields:
          - name
        multiple: true
        required: false
      - name: partner_names
        label: Overige partners (zonder eigen pagina)
        widget: list
        required: false
      - name: related
        label: Gerelateerde projecten
        hint: Leeg = automatisch (zelfde soort, nieuwste eerst).
        widget: relation
        collection: projecten
        value_field: '{{slug}}'
        search_fields:
          - title
        display_fields:
          - title
        multiple: true
        required: false
      - widget: object
        required: false
        fields:
          - name: label
            label: Tekst
            widget: string
          - name: url
            label: Link
            widget: string
        name: cta
        label: Knop (bijv. 'Bekijk het spel')
      - name: programme
        label: Opleiding (studentenproject)
        widget: select
        required: false
        options:
          - label: Communication and Multimedia Design
            value: cmd
          - label: HBO-ICT
            value: hbo-ict
          - label: Media, Informatie en Communicatie
            value: mic
          - label: Creative Business
            value: creative-business
          - label: Anders
            value: other
      - name: level
        label: Niveau (studentenproject)
        widget: select
        required: false
        options:
          - label: Associate degree
            value: associate
          - label: Bachelor
            value: bachelor
          - label: Master
            value: master
      - name: unit
        label: Onderwijseenheid (studentenproject)
        widget: string
        required: false
      - name: study_year
        label: Jaar van de opleiding (studentenproject)
        widget: string
        required: false
        hint: Bijvoorbeeld 'Jaar 2 + 3'.
      - name: student_count
        label: Aantal studenten (studentenproject)
        widget: number
        value_type: int
        required: false
      - name: scheme
        label: Regeling/financier (onderzoeksproject)
        widget: string
        required: false
      - name: researchers
        label: Onderzoekers (onderzoeksproject)
        widget: relation
        collection: mensen
        value_field: '{{slug}}'
        search_fields:
          - name
        display_fields:
          - name
        multiple: true
        required: false
      - name: sections
        label: Secties
        hint: De blokken van de pagina, van boven naar beneden.
        widget: list
        required: false
        types:
          - name: hero
            label: Banner (p5)
            widget: object
            fields:
              - name: sketch
                label: p5-sketch uit de bibliotheek
                hint: Wordt bij het bouwen als afbeelding gerenderd. Laat leeg voor de standaardbanner.
                widget: relation
                collection: sketches
                value_field: '{{slug}}'
                search_fields:
                  - title
                display_fields:
                  - title
                required: false
              - name: alt
                label: Beschrijving van de banner (alt-tekst)
                widget: string
                required: false
                hint: Laat leeg om de beschrijving uit de sketchbibliotheek te gebruiken.
              - name: title
                label: Titel in kaart
                widget: string
                required: false
                hint: Met titel krijgt de banner een bruine kaart.
              - name: text
                label: Tekst in kaart
                widget: text
                required: false
              - name: buttons
                label: Knoppen
                widget: list
                required: false
                fields:
                  - name: label
                    label: Tekst
                    widget: string
                  - name: url
                    label: Link
                    widget: string
                  - name: style
                    label: Stijl
                    widget: select
                    default: primary
                    options:
                      - label: Primair (bruin)
                        value: primary
                      - label: Secundair (lichtblauw)
                        value: secondary
                      - label: Secundair (omlijnd)
                        value: secondary2
              - name: download
                label: Toon 'Download p5 code'
                widget: boolean
                default: true
                required: false
          - name: intro
            label: Intro
            widget: object
            fields:
              - name: title
                label: Titel
                widget: string
              - name: body
                label: Tekst
                widget: markdown
              - name: buttons
                label: Knoppen
                widget: list
                required: false
                fields:
                  - name: label
                    label: Tekst
                    widget: string
                  - name: url
                    label: Link
                    widget: string
                  - name: style
                    label: Stijl
                    widget: select
                    default: primary
                    options:
                      - label: Primair (bruin)
                        value: primary
                      - label: Secundair (lichtblauw)
                        value: secondary
                      - label: Secundair (omlijnd)
                        value: secondary2
              - name: aside
                label: Tekst rechts
                widget: text
                required: false
              - widget: object
                required: false
                fields:
                  - name: label
                    label: Tekst
                    widget: string
                  - name: url
                    label: Link
                    widget: string
                name: aside_link
                label: Link rechts
          - name: project-cards
            label: Projectkaarten
            widget: object
            fields:
              - name: label
                label: Label boven titel
                widget: string
                required: false
              - name: title
                label: Titel
                widget: string
              - name: source
                label: Welke projecten
                widget: select
                default: featured
                options:
                  - label: Uitgelichte projecten (featured)
                    value: featured

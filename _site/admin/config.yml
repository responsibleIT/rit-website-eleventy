                    widget: string
                  - name: url
                    label: Link
                    widget: string
                name: all_link
                label: Link naar de hele agenda
          - name: people-grid
            label: Mensen
            widget: object
            fields:
              - name: title
                label: Titel
                widget: string
              - name: people

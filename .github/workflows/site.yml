# Validate → build → check on every pull request; on main also package and deploy.
#
# Deploy: the nginx image goes to ghcr.io/responsibleit/rit-website (:main and :<sha>), then Coolify is
# told to redeploy. Set the repository secrets COOLIFY_DEPLOY_URL (Coolify's "Deploy webhook" URL for the
# application) and COOLIFY_TOKEN (a Coolify API token with deploy permission). Without them the deploy
# step is skipped, so the pipeline works before Coolify is set up.
name: site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Chromium for rendering p5 sketches comes with this image; no browser download per run.
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}

      - run: npm ci --no-audit --no-fund

      - name: Check content against the schema
        run: npm run validate

      - name: Unit tests
        run: npm test

      # Rendered sketches (.cache/sketches) and optimised images (.cache/img), reused between runs.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: site-cache-${{ hashFiles('content/**', 'vendor/p5.min.js', 'scripts/render-sketches.mjs') }}
          restore-keys: site-cache-

      - name: Build
        run: npx @11ty/eleventy

      - name: Check links and images
        run: npm run check

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 7

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/responsibleit/rit-website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prebuilt
          push: true
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Tell Coolify to redeploy
        env:
          COOLIFY_DEPLOY_URL: ${{ secrets.COOLIFY_DEPLOY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_DEPLOY_URL" ]; then
            echo "::notice::COOLIFY_DEPLOY_URL not set; image pushed, deploy skipped."
            exit 0
          fi
          curl --fail-with-body -sS -X POST -H "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_DEPLOY_URL"

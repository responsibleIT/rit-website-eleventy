server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Relative Location headers: correct behind Coolify's TLS proxy.
    absolute_redirect off;

    # Eleventy writes /path/index.html; serve /path and /path/ from it.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Old URLs of the hand-written site.
    # (match the request, not $uri: nginx's own index lookup also produces /index.html)
    if ($request_uri = "/index.html") { return 301 /; }
    location = /over-RIT.html   { return 301 /over-rit/; }
    location = /over-p5.html    { return 301 /projecten/p5-banners-voor-de-rit-website/; }

    # Optimised images and fonts have content-hashed or stable names: cache long.
    location /img/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # The CMS config must never be stale.
    location = /admin/config.yml {
        add_header Cache-Control "no-cache";
        types { text/yaml yml; }
    }

    # Sketch sources are offered as downloads.
    location ~ \.js$ {
        location ~ ^/(sketches|projecten|nieuws|agenda)/ {
            add_header Content-Disposition "attachment";
        }
    }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript text/yaml image/svg+xml;
}
